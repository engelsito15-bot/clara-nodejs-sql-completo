<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c2d25" />
  <title>Clara — Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5ef;color:#0d2921;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,430px);padding:34px;border:1px solid #dce4df;border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(12,45,37,.12)}.mark{width:58px;height:58px;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:5px;padding:11px;border-radius:18px;background:#b9ead4}.mark i{display:block;border-radius:4px 4px 2px 2px;background:#0c2d25}.mark i:nth-child(1){height:13px}.mark i:nth-child(2){height:22px}.mark i:nth-child(3){height:31px}h1{margin:22px 0 8px;font-size:30px;letter-spacing:-.04em}p{margin:0;color:#627069;line-height:1.6}button{width:100%;min-height:50px;margin-top:24px;border:0;border-radius:15px;background:#104c3c;color:#fff;font-weight:800;font-size:14px}small{display:block;margin-top:14px;color:#89948e;line-height:1.5}
  </style>
</head>
<body><main class="card"><div class="mark"><i></i><i></i><i></i></div><h1>Clara sigue contigo.</h1><p>No hay conexión a internet. Si ya habías abierto Clara en este dispositivo, vuelve a intentarlo para acceder a la copia disponible.</p><button onclick="location.reload()">Reintentar</button><small>Los movimientos que hayas guardado sin conexión se sincronizarán cuando vuelva internet.</small></main></body>
</html>
